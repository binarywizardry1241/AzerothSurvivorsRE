[package]
name = "azeroth-survivors-re"
version = "0.141.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Azeroth Survivors executable reconstruction: native main-menu milestone"

[package.metadata.reconstruction]
target-version = "0.141.0"
target-provenance = "docs/analysis/target-refresh-0.141.0.json"
reconstruction-baseline = "0.141.0"
menu-source-origin = "0.92.0"
guardian-source-version = "0.97.2"
enemy-source-version = "0.97.2"
boss-source-version = "0.97.2"
player-ability-source-version = "0.97.2"

[lints]
workspace = true

[dependencies]
# The menu uses the same Bevy version as the engine, with its 2D/UI feature set.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app", "default_platform", "2d_bevy_render", "3d_bevy_render", "ui_api", "ui_bevy_render", "default_font", "png"
] }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-world = { path = "../benilla-world", default-features = false }
benilla-ui = { path = "../benilla-ui", default-features = false }
benilla-app = { path = "../benilla-app", default-features = false }
benilla-protocol = { path = "../benilla-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22.1"
sha1 = "0.10.6"
getrandom = "0.3.4"
# Same WebSocket implementation/version identified in the 0.115.0 EXE.
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "=2.12.1", features = ["json"] }
# Keep the updater's TLS dependency at the version identified in the target.
rustls = { version = "=0.23.43", default-features = false }
# Native updater gzip version; existing target/lock crypto provider for SHA256 fixtures.
flate2 = "=1.1.9"
ring = "=0.17.14"
# Native co-op staff vouches require strict Ed25519 verification.
ed25519-dalek = "=2.2.0"
# Reuse the engine mixer/output seam; Kira's built-in CPAL backend stays off.
anyhow.workspace = true
kira = { version = "0.12", default-features = false, features = ["mp3", "wav", "pcm", "adpcm"] }
assert_no_alloc = "1.1"
symphonia = { version = "0.6", default-features = false }
rtrb = "0.3"
mint = "0.5"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.13", default-features = false, features = ["audio_unit", "core_audio"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
cpal = "0.17"

[[bin]]
name = "AzerothSurvivorsRE"
path = "src/main.rs"
test = false
